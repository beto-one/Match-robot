name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Arrange project files
        run: |
          mkdir -p app/src/main/java/com/mathrobot/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mv app_build.gradle.kts app/build.gradle.kts
          mv AndroidManifest.xml app/src/main/
          mv MainActivity.kt app/src/main/java/com/mathrobot/app/
          mv themes.xml strings.xml app/src/main/res/values/
          mv ic_launcher.xml app/src/main/res/drawable/

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: MathRobot-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
